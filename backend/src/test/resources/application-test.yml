spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  storage:
    audio-dir: build/test-audio
  stt:
    worker-url: http://localhost:8000
    callback-url: http://localhost:8080/internal/stt/callback
    shared-secret: lecturenote-secret-token-change-in-prod
